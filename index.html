<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CmdVault - Command Line Quick Reference &amp; Interactive Cheat Sheet</title>
  <meta name="description" content="CmdVault: Beautiful, instant command line reference &amp; interactive cheat sheet with 330+ verified commands across Git, Linux Bash, Windows PowerShell, MySQL, and PostgreSQL with 1-click clipboard copy." />
  <meta name="keywords" content="cmdvault, command cheat sheet, git commands, linux bash commands, powershell commands, mysql queries, postgresql queries, cli reference, devops cheat sheet" />
  <meta name="author" content="Parth Sonavane" />
  <meta name="theme-color" content="#131314" />
  <link rel="canonical" href="https://cmd-valut.vercel.app/" />

  <!-- Favicon &amp; Brand Icons -->
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="apple-touch-icon" href="images/logo.png" />

  <!-- OpenGraph / Social Media (Facebook, LinkedIn, Discord, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cmd-valut.vercel.app/" />
  <meta property="og:title" content="CmdVault - Command Line Quick Reference &amp; Interactive Cheat Sheet" />
  <meta property="og:description" content="Instant CLI reference &amp; interactive developer cheat sheet with 330+ commands across Git, Linux, PowerShell, MySQL, and PostgreSQL." />
  <meta property="og:image" content="https://cmd-valut.vercel.app/images/logo.png" />
  <meta property="og:site_name" content="CmdVault" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:url" content="https://cmd-valut.vercel.app/" />
  <meta name="twitter:title" content="CmdVault - Developer Command Cheat Sheet" />
  <meta name="twitter:description" content="Instant CLI reference with 330+ commands across Git, Linux, PowerShell, MySQL, and PostgreSQL." />
  <meta name="twitter:image" content="https://cmd-valut.vercel.app/images/logo.png" />

  <!-- Local Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header Bar (Top Navigation) -->
    <header class="header-bar" role="banner">
      <div class="header-inner">
        <!-- Brand Logo (Clean, Sharp & Exact) -->
        <a href="/" class="logo-wrapper" aria-label="CmdVault Home">
          <span class="logo-symbol">&lt;/&gt;!</span>
          <span class="logo-text">CmdVault</span>
        </a>

        <!-- Google Search Pill -->
        <div class="search-container" role="search">
          <img src="icons/search.svg" alt="Search icon" class="search-icon" width="20" height="20" />
          <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="Search commands, flags, or syntax..." 
            autocomplete="off" 
            spellcheck="false" 
            aria-label="Search commands" 
          />
          <kbd class="search-kbd" title="Press / to search">/</kbd>
          <button id="search-clear" class="search-clear" aria-label="Clear search" title="Clear search">&times;</button>
        </div>

        <!-- Right Header Actions -->
        <div class="header-actions">
          <!-- Auth Wrapper -->
          <div class="auth-wrapper">
            <button id="auth-btn" class="auth-btn" aria-label="Login with GitHub">
              <img src="icons/GITHUB ICON 1.png" alt="GitHub" class="auth-icon" width="22" height="22" />
              <span class="auth-label">Login with Github</span>
            </button>
          </div>

          <!-- Logged In Profile -->
          <div id="user-profile" class="user-profile">
            <img id="user-avatar" class="user-avatar" src="" alt="User Avatar" />
            <div class="user-details">
              <span id="user-name" class="user-name">User</span>
              <a href="#" id="logout-btn" class="logout-link">Sign Out</a>
            </div>
          </div>

          <!-- Theme Toggle -->
          <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
            <img src="icons/sun.svg" alt="Theme icon" class="theme-icon" width="20" height="20" />
          </button>
        </div>
      </div>
    </header>

    <!-- Sub-Header Category Navigation Tabs (Google Material 3 Segmented Nav) -->
    <nav class="category-nav-bar" aria-label="Command Categories">
      <div class="category-nav-inner">
        <button class="nav-tab active" data-category="github-git">GitHub-Git</button>
        <button class="nav-tab" data-category="linux-bash">Linux-Bash</button>
        <button class="nav-tab" data-category="powershell-windows">Powershell-Windows</button>
        <button class="nav-tab" data-category="sql-mysql">MySQL</button>
        <button class="nav-tab" data-category="sql-postgresql">PostgreSQL</button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" role="main">
      <div class="section-title-wrap">
        <h1 class="page-title">Popular commands</h1>
        
        <!-- OS Filter Chips -->
        <div class="os-filters-group" role="group" aria-label="Filter by Operating System">
          <button class="os-pill" data-os="windows" aria-label="Filter by Windows">
            <img src="icons/image 1.png" alt="Windows" width="18" height="18" />
            <span>Windows</span>
          </button>
          <button class="os-pill" data-os="linux" aria-label="Filter by Linux">
            <img src="icons/image 3.png" alt="Linux" width="18" height="18" />
            <span>Linux</span>
          </button>
          <button class="os-pill" data-os="macos" aria-label="Filter by MacOS">
            <img src="icons/image 2.png" alt="MacOS" width="18" height="18" />
            <span>MacOS</span>
          </button>
        </div>
      </div>

      <!-- Commands Container (Dynamically Populated) -->
      <div id="commands-container" class="commands-container">
        <!-- Rendered by js/app.js -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state">
        <h3 class="empty-state-title">No commands matched your search</h3>
        <p class="empty-state-subtitle">Try searching for keywords like "commit", "branch", "config", or "systemctl".</p>
        <button id="reset-search-btn" class="reset-search-btn">Reset Search &amp; Filters</button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer-bar" role="contentinfo">
      <div class="footer-inner">
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <span>•</span>
          <a href="terms.html">Terms &amp; Conditions</a>
          <span>•</span>
          <a href="cookies.html">Cookies Policy</a>
          <span>•</span>
          <a href="contact.html">Contact Us</a>
          <span>•</span>
          <a href="mailto:sonavaneparthgit@gmail.com">Email</a>
        </div>
        <p class="footer-copyright">CmdVault • Open-source CLI Reference</p>
      </div>
    </footer>
  </div>

  <!-- Toast Notification Container (Google Snackbar) -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/env.js" onerror="this.remove()"></script>
  <script src="js/commands-data.js"></script>
  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
